[phases.setup]
# Install required packages for Django + PostgreSQL
nixPkgs = ["openssl", "postgresql_16", "gcc", "python39", "python310Packages.pip"]

[phases.build]
# Install Python dependencies, run migrations, collect static files
cmd = "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"

[phases.start]
# Start Django with Gunicorn
cmd = "gunicorn novaera.wsgi:application --workers=3 --threads=2 --bind 0.0.0.0:${PORT} --log-level=debug"

[checks]
# Healthcheck endpoint (adjust if your app uses another path)
healthcheck = "/health/"
