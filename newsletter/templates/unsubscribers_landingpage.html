{% extends 'base/base.html' %}
{% load static %}

{% block content %} 

 <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  
  <!--Main Navigation-->
  <header>
    <!--Favicon-->
    <!--<link rel="shortcut icon" href='{% static "favicon.jpg" %}'>-->
    
    <style>
      /*Este CSS é para que me poña en vermello as alertas dos forms cando salen mal*/
      /* Carousel styling */
      .carousel-item {
        height: 100vh;
        background-image: url('{% static "confirmacion_reserva.jpg" %}');
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center center;
      }
      /*Con esto oculta a barra horizontal*/
      body{
        overflow-x: hidden;
      }
      #ul_pag_entradas_confirmacion{
        font-size: 1.1em;
      }
      #p_pag_entradas_confirmacion{
        font-size: 1.1em;
      }

    </style>     
      <!-- Inner -->
      <div class="carousel-inner">
        <!-- Single item -->
        <div class="carousel-item active">
          <div class="mask" style="background-color: rgba(0, 0, 0, 0.8);">
            <div class="d-flex justify-content-center align-items-center h-100">
              <div class="text-white" style="text-align:center ;">
                <form method="post" novalidate class="d-flex flex-column align-items-center">
                  {% csrf_token %}
                  <!-- Email input -->
                  <div class="form-outline mb-4 w-50" id="subscribirse_boton">
                    {{ form_unsubscribed_newsletter.email_subscriptor }}
                  </div>
                  <!-- Submit button -->
                  <div class="form-check d-flex justify-content-center mb-2">
                    <!--Eiqui linkeo o "submit" botón a sección da páxina footer para que me volva a él despois dun fallo ou correcta completacion-->
                    <button type="submit" class="btn btn-outline-light btn-block mb-2">
                      Darse de Baixa
                    </button>
                  </div>
                </form>
                <h2>&#128546;</h2>
                <h2>Se cambia de opinión, sempre se pode subscribir outra vez en <a href="https:www.novaera.gal/#footer" target="_blank" style="display:block; text-decoration:none; color:inherit;"><strong>novaera.gal</strong></a></h2>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Carousel wrapper -->
  </header>

  {% endblock %}
