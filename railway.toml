# railway.toml
project = "novaera"

[build]
# We rely on Nixpacks for environment setup
builder = "nixpacks"

[deploy]
start = "gunicorn NovaEra.wsgi:application --bind 0.0.0.0:${PORT} --workers=3"

[env]
# No secrets here! Set your secrets in Railway's Environments tab
# Example variables you should add via Railway UI:
# SECRET_KEY
# DEBUG
# DB_NAME
# DB_USER
# DB_PASSWORD
# DB_HOST
# DB_PORT
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# EMAIL_HOST_USER
# EMAIL_HOST_PASSWORD
